name: Deploy Agora to Azure App Service

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      docker_tag:
        description: 'Docker image tag to deploy (leave empty to build new image)'
        required: false
        default: ''
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod

env:
  AZURE_IMAGE_NAME: agora

permissions:
  id-token: write   # Required for OIDC authentication
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: github.event.inputs.docker_tag == ''
    outputs:
      docker_tag: ${{ steps.set-tag.outputs.TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Docker tag
        id: set-tag
        run: |
          echo "TAG=appservice-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.PROD_ACR_SERVER }}
          username: ${{ vars.PROD_ACR_USERNAME }}
          password: ${{ secrets.PROD_ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          build-args: |
            NEXT_PUBLIC_BUILD_ID=${{ github.sha }}
            SENTRY_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_URL=${{ vars.PROD_NEXT_PUBLIC_URL }}
            NEXT_PUBLIC_LOGOS_URL=${{ vars.PROD_NEXT_PUBLIC_LOGOS_URL }}
            NEXT_PUBLIC_GRAPHQL_URL=${{ vars.PROD_NEXT_PUBLIC_GRAPHQL_URL }}
            NEXT_PUBLIC_HASURA_WS_URL=${{ vars.PROD_NEXT_PUBLIC_HASURA_WS_URL }}
            NEXT_PUBLIC_AUTH0_DOMAIN=${{ vars.PROD_NEXT_PUBLIC_AUTH0_DOMAIN }}
            NEXT_PUBLIC_AUTH0_CLIENT_ID=${{ vars.PROD_NEXT_PUBLIC_AUTH0_CLIENT_ID }}
            NEXT_PUBLIC_AUTH0_REDIRECT_URI=${{ vars.PROD_NEXT_PUBLIC_AUTH0_REDIRECT_URI }}
            NEXT_PUBLIC_AUTH0_AUDIENCE=${{ vars.PROD_NEXT_PUBLIC_AUTH0_AUDIENCE }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.PROD_NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_AMPLITUDE_API_KEY=${{ vars.PROD_NEXT_PUBLIC_AMPLITUDE_API_KEY }}
            NEXT_PUBLIC_COMPOSE_BASE_URL=${{ vars.PROD_NEXT_PUBLIC_COMPOSE_BASE_URL }}
          tags: |
            ${{ vars.PROD_ACR_SERVER }}/${{ env.AZURE_IMAGE_NAME }}:${{ steps.set-tag.outputs.TAG }}
            ${{ vars.PROD_ACR_SERVER }}/${{ env.AZURE_IMAGE_NAME }}:appservice-latest

      - name: Send build success notification
        if: success()
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"text\": \"🚀 [App Service] Docker image build completed: ${{ vars.PROD_ACR_SERVER }}/${{ env.AZURE_IMAGE_NAME }}:${{ steps.set-tag.outputs.TAG }}\"}" \
          ${{ vars.HERMES_WEBHOOK_URL }} || true

      - name: Send build failure notification
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"text\": \"❌ [App Service] Docker image build failed\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          ${{ vars.HERMES_WEBHOOK_URL }} || true

  deploy-to-app-service:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set deployment tag
        id: deployment-tag
        run: |
          if [[ -n "${{ github.event.inputs.docker_tag }}" ]]; then
            echo "TAG=${{ github.event.inputs.docker_tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ needs.build-and-push.outputs.docker_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        run: |
          DEPLOYMENT_NAME="agora-appservice-$(date +%Y%m%d-%H%M%S)"

          az deployment group create \
            --resource-group "${{ vars.PROD_RESOURCE_GROUP }}" \
            --name "$DEPLOYMENT_NAME" \
            --template-file deployments/ACS/azure-app-service.bicep \
            --parameters \
              buildId="${{ github.sha }}" \
              appServiceName="${{ vars.PROD_APP_SERVICE_NAME }}" \
              location="${{ vars.PROD_LOCATION }}" \
              environment="production" \
              containerImage="${{ vars.PROD_ACR_SERVER }}/${{ env.AZURE_IMAGE_NAME }}:${{ steps.deployment-tag.outputs.TAG }}" \
              acrServer="${{ vars.PROD_ACR_SERVER }}" \
              acrUsername="${{ vars.PROD_ACR_USERNAME }}" \
              acrPassword="${{ secrets.PROD_ACR_PASSWORD }}" \
              hasuraAdminSecret="${{ secrets.PROD_HASURA_ADMIN_SECRET }}" \
              auth0ClientSecret="${{ secrets.PROD_AUTH0_CLIENT_SECRET }}" \
              nextServerActionsEncryptionKey="${{ secrets.PROD_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}" \
              skuName="P1v3" \
              enableCustomDomain=false \
              appUrl="${{ vars.PROD_NEXT_PUBLIC_URL }}" \
              logosUrl="${{ vars.PROD_NEXT_PUBLIC_LOGOS_URL }}" \
              graphqlUrl="${{ vars.PROD_NEXT_PUBLIC_GRAPHQL_URL }}" \
              hasuraWsUrl="${{ vars.PROD_NEXT_PUBLIC_HASURA_WS_URL }}" \
              auth0Domain="${{ vars.PROD_NEXT_PUBLIC_AUTH0_DOMAIN }}" \
              auth0ClientId="${{ vars.PROD_NEXT_PUBLIC_AUTH0_CLIENT_ID }}" \
              auth0RedirectUri="${{ vars.PROD_NEXT_PUBLIC_AUTH0_REDIRECT_URI }}" \
              auth0Audience="${{ vars.PROD_NEXT_PUBLIC_AUTH0_AUDIENCE }}" \
              gaMeasurementId="${{ vars.PROD_NEXT_PUBLIC_GA_MEASUREMENT_ID }}" \
              amplitudeApiKey="${{ vars.PROD_NEXT_PUBLIC_AMPLITUDE_API_KEY }}"

      - name: Get deployment outputs
        id: deployment-outputs
        run: |
          FQDN=$(az webapp show \
            --name "${{ vars.PROD_APP_SERVICE_NAME }}" \
            --resource-group "${{ vars.PROD_RESOURCE_GROUP }}" \
            --query "defaultHostName" \
            --output tsv)
          echo "FQDN=$FQDN" >> $GITHUB_OUTPUT

      - name: Update Front Door origin to App Service
        run: |
          # Update Front Door origin to point to the new App Service
          az afd origin update \
            --profile-name agora-prod-afd \
            --resource-group "${{ vars.PROD_RESOURCE_GROUP }}" \
            --origin-group-name agora-origin-group \
            --origin-name agora-container-app \
            --host-name "${{ steps.deployment-outputs.outputs.FQDN }}" \
            --origin-host-header "${{ steps.deployment-outputs.outputs.FQDN }}" || echo "Front Door update skipped - may need manual configuration"

      - name: Send deployment success notification
        if: success()
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"text\": \"✅ [App Service] Deployment completed\n🔗 URL: https://${{ steps.deployment-outputs.outputs.FQDN }}\n🏷️  Tag: ${{ steps.deployment-tag.outputs.TAG }}\"}" \
          ${{ vars.HERMES_WEBHOOK_URL }} || true

      - name: Send deployment failure notification
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"text\": \"❌ [App Service] Deployment failed\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          ${{ vars.HERMES_WEBHOOK_URL }} || true

      - name: Azure Logout
        if: always()
        run: az logout

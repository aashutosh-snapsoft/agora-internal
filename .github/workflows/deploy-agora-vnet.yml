name: Deploy Agora to VNet (Ergon Stack)

# Manual trigger for deploying Agora frontend to VNet infrastructure
# connecting to Logos backend within the same VNet
#
# This deployment:
# - Uses the Container Apps Environment from infrastructure repo
# - Connects to Logos backend via internal VNet address (provided as input)
# - Writes deployment outputs to Azure App Configuration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'
      docker_tag:
        description: 'Docker image tag to deploy (leave empty to build from current branch)'
        required: false
        type: string
        default: ''
      logos_api_url:
        description: 'Logos API URL (internal VNet address, leave empty for environment default)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run (what-if) only - no actual deployment'
        required: false
        type: boolean
        default: false
      code_branch:
        description: 'Branch containing Bicep files and code'
        required: false
        type: string
        default: ''

env:
  AZURE_REGISTRY: socraticsprodacr.azurecr.io
  AZURE_IMAGE_NAME: agora

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: ${{ inputs.docker_tag == '' }}
    outputs:
      image_tag: ${{ steps.set-tag.outputs.TAG }}

    steps:
      - name: Login to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set environment variables
        id: set-env
        run: |
          ENV="${{ inputs.environment }}"
          APP_CONFIG_NAME="logos-${ENV}-config"

          if [[ "$ENV" == "prod" ]]; then
            echo "PREFIX=PROD" >> $GITHUB_OUTPUT
            echo "DEFAULT_BRANCH=prod-orchestration-env" >> $GITHUB_OUTPUT
          else
            echo "PREFIX=DEV" >> $GITHUB_OUTPUT
            echo "DEFAULT_BRANCH=dev-orchestration-env" >> $GITHUB_OUTPUT
          fi

          # Use provided branch or default based on environment
          if [[ -n "${{ inputs.code_branch }}" ]]; then
            echo "BRANCH=${{ inputs.code_branch }}" >> $GITHUB_OUTPUT
          elif [[ "$ENV" == "prod" ]]; then
            echo "BRANCH=prod-orchestration-env" >> $GITHUB_OUTPUT
          else
            echo "BRANCH=dev-orchestration-env" >> $GITHUB_OUTPUT
          fi

          # Get Logos URL from App Config, fallback to input if provided
          if [[ -n "${{ inputs.logos_api_url }}" ]]; then
            echo "LOGOS_URL=${{ inputs.logos_api_url }}" >> $GITHUB_OUTPUT
          else
            LOGOS_CONTAINER_URL=$(az appconfig kv show \
              --name "$APP_CONFIG_NAME" \
              --key "logos-ergon/${ENV}/containerAppUrl" \
              --label "$ENV" \
              --query value -o tsv 2>/dev/null || echo "")

            if [[ -n "$LOGOS_CONTAINER_URL" ]]; then
              echo "LOGOS_URL=${LOGOS_CONTAINER_URL}/api/v1" >> $GITHUB_OUTPUT
            else
              echo "::warning::Could not fetch Logos URL from App Config, using fallback"
              if [[ "$ENV" == "prod" ]]; then
                echo "LOGOS_URL=https://logos-ergon-prod.gentleground-5765fe77.westus2.azurecontainerapps.io/api/v1" >> $GITHUB_OUTPUT
              else
                echo "LOGOS_URL=https://logos-ergon-dev.agreeableocean-522783b3.westus2.azurecontainerapps.io/api/v1" >> $GITHUB_OUTPUT
              fi
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.set-env.outputs.BRANCH }}

      - name: Set Docker tag
        id: set-tag
        run: |
          BRANCH_NAME="${{ steps.set-env.outputs.BRANCH }}"
          BRANCH_NAME="${BRANCH_NAME//\//-}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "TAG=${BRANCH_NAME}-${SHORT_SHA}-${{ inputs.environment }}" >> $GITHUB_OUTPUT

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_REGISTRY }}
          username: ${{ vars.PROD_ACR_USERNAME }}
          password: ${{ secrets.PROD_ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        env:
          PREFIX: ${{ steps.set-env.outputs.PREFIX }}
        with:
          context: .
          push: true
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          build-args: |
            NEXT_PUBLIC_BUILD_ID=${{ github.sha }}
            SENTRY_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_URL=${{ steps.set-env.outputs.PREFIX == 'PROD' && vars.PROD_NEXT_PUBLIC_URL || vars.DEV_NEXT_PUBLIC_URL }}
            NEXT_PUBLIC_LOGOS_URL=${{ steps.set-env.outputs.PREFIX == 'PROD' && vars.PROD_NEXT_PUBLIC_LOGOS_URL || vars.DEV_NEXT_PUBLIC_LOGOS_URL }}
            NEXT_PUBLIC_GRAPHQL_URL=${{ steps.set-env.outputs.PREFIX == 'PROD' && vars.PROD_NEXT_PUBLIC_GRAPHQL_URL || vars.DEV_NEXT_PUBLIC_GRAPHQL_URL }}
            NEXT_PUBLIC_HASURA_WS_URL=${{ steps.set-env.outputs.PREFIX == 'PROD' && vars.PROD_NEXT_PUBLIC_HASURA_WS_URL || vars.DEV_NEXT_PUBLIC_HASURA_WS_URL }}
            NEXT_PUBLIC_AUTH0_DOMAIN=${{ steps.set-env.outputs.PREFIX == 'PROD' && vars.PROD_NEXT_PUBLIC_AUTH0_DOMAIN || vars.DEV_NEXT_PUBLIC_AUTH0_DOMAIN }}
            NEXT_PUBLIC_AUTH0_CLIENT_ID=${{ steps.set-env.outputs.PREFIX == 'PROD' && vars.PROD_NEXT_PUBLIC_AUTH0_CLIENT_ID || vars.DEV_NEXT_PUBLIC_AUTH0_CLIENT_ID }}
            NEXT_PUBLIC_AUTH0_REDIRECT_URI=${{ steps.set-env.outputs.PREFIX == 'PROD' && vars.PROD_NEXT_PUBLIC_AUTH0_REDIRECT_URI || vars.DEV_NEXT_PUBLIC_AUTH0_REDIRECT_URI }}
            NEXT_PUBLIC_AUTH0_AUDIENCE=${{ steps.set-env.outputs.PREFIX == 'PROD' && vars.PROD_NEXT_PUBLIC_AUTH0_AUDIENCE || vars.DEV_NEXT_PUBLIC_AUTH0_AUDIENCE }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ steps.set-env.outputs.PREFIX == 'PROD' && vars.PROD_NEXT_PUBLIC_GA_MEASUREMENT_ID || vars.DEV_NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_AMPLITUDE_API_KEY=${{ steps.set-env.outputs.PREFIX == 'PROD' && vars.PROD_NEXT_PUBLIC_AMPLITUDE_API_KEY || vars.DEV_NEXT_PUBLIC_AMPLITUDE_API_KEY }}
            NEXT_PUBLIC_COMPOSE_BASE_URL=${{ steps.set-env.outputs.PREFIX == 'PROD' && vars.PROD_NEXT_PUBLIC_COMPOSE_BASE_URL || vars.DEV_NEXT_PUBLIC_COMPOSE_BASE_URL }}
          tags: |
            ${{ env.AZURE_REGISTRY }}/${{ env.AZURE_IMAGE_NAME }}:${{ steps.set-tag.outputs.TAG }}

      - name: Output image details
        run: |
          echo "## Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ${{ env.AZURE_REGISTRY }}/${{ env.AZURE_IMAGE_NAME }}:${{ steps.set-tag.outputs.TAG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ steps.set-env.outputs.BRANCH }} |" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to VNet (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')

    steps:
      - name: Set environment variables
        id: set-env
        run: |
          ENV="${{ inputs.environment }}"
          if [[ "$ENV" == "prod" ]]; then
            echo "PREFIX=PROD" >> $GITHUB_OUTPUT
            echo "DEFAULT_BRANCH=prod-orchestration-env" >> $GITHUB_OUTPUT
            echo "RESOURCE_GROUP=prod-westus2-deployment" >> $GITHUB_OUTPUT
          else
            echo "PREFIX=DEV" >> $GITHUB_OUTPUT
            echo "DEFAULT_BRANCH=dev-orchestration-env" >> $GITHUB_OUTPUT
            echo "RESOURCE_GROUP=dev-westus2-deployment" >> $GITHUB_OUTPUT
          fi

          # Use provided branch or default based on environment
          if [[ -n "${{ inputs.code_branch }}" ]]; then
            echo "BRANCH=${{ inputs.code_branch }}" >> $GITHUB_OUTPUT
          elif [[ "$ENV" == "prod" ]]; then
            echo "BRANCH=prod-orchestration-env" >> $GITHUB_OUTPUT
          else
            echo "BRANCH=dev-orchestration-env" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.set-env.outputs.BRANCH }}

      - name: Determine image tag
        id: image-tag
        run: |
          if [ -n "${{ inputs.docker_tag }}" ]; then
            echo "TAG=${{ inputs.docker_tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ needs.build.outputs.image_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Login to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch infrastructure config from App Config
        id: fetch-config
        run: |
          APP_CONFIG_NAME="logos-${{ inputs.environment }}-config"
          ENV="${{ inputs.environment }}"
          RESOURCE_GROUP="${{ steps.set-env.outputs.RESOURCE_GROUP }}"
          SUBSCRIPTION_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"

          echo "Fetching infrastructure config from $APP_CONFIG_NAME..."

          # Get CAE name from App Config (required)
          CAE_ENV_NAME=$(az appconfig kv show \
            --name "$APP_CONFIG_NAME" \
            --key "containerApps/${ENV}/environmentName" \
            --label "${ENV}" \
            --query value -o tsv 2>/dev/null || echo "")

          if [ -z "$CAE_ENV_NAME" ]; then
            echo "::error::containerApps/${ENV}/environmentName not found in App Configuration"
            exit 1
          fi

          # Build CAE ID from name, subscription, and resource group
          CAE_ENV_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.App/managedEnvironments/${CAE_ENV_NAME}"

          echo "container_apps_environment_id=$CAE_ENV_ID" >> $GITHUB_OUTPUT
          echo "container_apps_environment_name=$CAE_ENV_NAME" >> $GITHUB_OUTPUT

          # Get CAE default domain from App Config (required for Logos URL)
          CAE_DEFAULT_DOMAIN=$(az appconfig kv show \
            --name "$APP_CONFIG_NAME" \
            --key "containerApps/${ENV}/defaultDomain" \
            --label "${ENV}" \
            --query value -o tsv 2>/dev/null || echo "")

          if [ -z "$CAE_DEFAULT_DOMAIN" ]; then
            echo "::error::containerApps/${ENV}/defaultDomain not found in App Configuration"
            exit 1
          fi
          echo "cae_default_domain=$CAE_DEFAULT_DOMAIN" >> $GITHUB_OUTPUT

          # Construct Logos internal URL from default domain
          LOGOS_INTERNAL_URL="https://logos-ergon-${ENV}.internal.${CAE_DEFAULT_DOMAIN}/api/v1"
          echo "logos_internal_url=$LOGOS_INTERNAL_URL" >> $GITHUB_OUTPUT
          echo "logos_api_url=$LOGOS_INTERNAL_URL" >> $GITHUB_OUTPUT

          # ── CosmosDB (endpoint + account name from App Config; key fetched
          # at deploy time from Azure with the workflow's OIDC creds). Hasura
          # is being removed; Cosmos is the new SoT for projects. agora's
          # project-directory + document-create BFF routes read from here.
          COSMOS_ENDPOINT=$(az appconfig kv show \
            --name "$APP_CONFIG_NAME" \
            --key "data/${ENV}/cosmosEndpoint" \
            --label "${ENV}" \
            --query value -o tsv 2>/dev/null || echo "")

          COSMOS_ACCOUNT_NAME=$(az appconfig kv show \
            --name "$APP_CONFIG_NAME" \
            --key "data/${ENV}/cosmosAccountName" \
            --label "${ENV}" \
            --query value -o tsv 2>/dev/null || echo "")

          if [ -z "$COSMOS_ENDPOINT" ] || [ -z "$COSMOS_ACCOUNT_NAME" ]; then
            echo "::error::data/${ENV}/cosmosEndpoint or data/${ENV}/cosmosAccountName not found in App Configuration"
            exit 1
          fi

          # Pull the primary key now; never echo it.
          COSMOS_KEY=$(az cosmosdb keys list \
            --name "$COSMOS_ACCOUNT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query primaryMasterKey -o tsv)
          if [ -z "$COSMOS_KEY" ]; then
            echo "::error::Could not fetch Cosmos primary key for $COSMOS_ACCOUNT_NAME in $RESOURCE_GROUP"
            exit 1
          fi
          echo "::add-mask::$COSMOS_KEY"

          echo "cosmos_endpoint=$COSMOS_ENDPOINT" >> $GITHUB_OUTPUT
          echo "cosmos_key=$COSMOS_KEY" >> $GITHUB_OUTPUT

          echo "## Infrastructure (from App Config)" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Container Apps Environment | $CAE_ENV_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| CAE Default Domain | $CAE_DEFAULT_DOMAIN |" >> $GITHUB_STEP_SUMMARY
          echo "| Logos Internal URL | $LOGOS_INTERNAL_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| Cosmos Endpoint | $COSMOS_ENDPOINT |" >> $GITHUB_STEP_SUMMARY
          echo "| Cosmos Account | $COSMOS_ACCOUNT_NAME (key masked) |" >> $GITHUB_STEP_SUMMARY

      - name: Determine Logos API URL
        id: logos-url
        run: |
          # Priority: User override > App Config derived > Fallback
          if [[ -n "${{ steps.set-env.outputs.LOGOS_URL_OVERRIDE }}" ]]; then
            LOGOS_URL="${{ steps.set-env.outputs.LOGOS_URL_OVERRIDE }}"
            echo "Using user-provided Logos URL override"
          else
            LOGOS_URL="${{ steps.fetch-config.outputs.logos_internal_url }}"
            echo "Using Logos URL from App Config"
          fi
          echo "LOGOS_URL=$LOGOS_URL" >> $GITHUB_OUTPUT
          echo "Logos API URL: $LOGOS_URL"

      - name: Deploy (What-If)
        if: ${{ inputs.dry_run == true }}
        env:
          PREFIX: ${{ steps.set-env.outputs.PREFIX }}
        run: |
          echo "## Deployment What-If" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Get environment-specific values
          HASURA_SECRET=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ secrets.PROD_HASURA_ADMIN_SECRET }}"; else echo "${{ secrets.DEV_HASURA_ADMIN_SECRET }}"; fi)
          AUTH0_CLIENT_SECRET_VAL=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ secrets.PROD_AUTH0_CLIENT_SECRET }}"; else echo "${{ secrets.DEV_AUTH0_CLIENT_SECRET }}"; fi)
          AUTH0_SESSION_SECRET=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ secrets.PROD_AUTH0_SECRET }}"; else echo "${{ secrets.DEV_AUTH0_SECRET }}"; fi)
          NEXT_SERVER_ACTIONS_KEY=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ secrets.PROD_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}"; else echo "${{ secrets.DEV_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}"; fi)
          SENTRY_DSN=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ secrets.PROD_SENTRY_DSN }}"; else echo "${{ secrets.DEV_SENTRY_DSN }}"; fi)
          APP_URL=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_URL }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_URL }}"; fi)
          GRAPHQL_URL=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_GRAPHQL_URL }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_GRAPHQL_URL }}"; fi)
          HASURA_WS_URL=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_HASURA_WS_URL }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_HASURA_WS_URL }}"; fi)
          AUTH0_DOMAIN=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_AUTH0_DOMAIN }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_AUTH0_DOMAIN }}"; fi)
          AUTH0_CLIENT_ID=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_AUTH0_CLIENT_ID }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_AUTH0_CLIENT_ID }}"; fi)
          AUTH0_REDIRECT_URI=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_AUTH0_REDIRECT_URI }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_AUTH0_REDIRECT_URI }}"; fi)
          AUTH0_AUDIENCE=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_AUTH0_AUDIENCE }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_AUTH0_AUDIENCE }}"; fi)
          AUTH0_BASE_URL=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_AUTH0_BASE_URL }}"; else echo "${{ vars.DEV_AUTH0_BASE_URL }}"; fi)
          AUTH0_ISSUER_BASE_URL=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_AUTH0_ISSUER_BASE_URL }}"; else echo "${{ vars.DEV_AUTH0_ISSUER_BASE_URL }}"; fi)
          GA_MEASUREMENT_ID=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_GA_MEASUREMENT_ID }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_GA_MEASUREMENT_ID }}"; fi)
          AMPLITUDE_API_KEY=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_AMPLITUDE_API_KEY }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_AMPLITUDE_API_KEY }}"; fi)
          CUSTOM_DOMAIN=$(if [ "$PREFIX" == "PROD" ]; then echo "app.socratics.ai"; else echo "app.dev.socratics.ai"; fi)
          CPU=$(if [ "$PREFIX" == "PROD" ]; then echo "4.0"; else echo "1.0"; fi)
          MEMORY=$(if [ "$PREFIX" == "PROD" ]; then echo "8Gi"; else echo "2Gi"; fi)
          MIN_REPLICAS=$(if [ "$PREFIX" == "PROD" ]; then echo "5"; else echo "1"; fi)
          # dev capped at 1: STALE RATIONALE (PR #569 re-review) — this cap was
          # sized around demo-staging's stateful, in-memory WebSocket server
          # (openclaw job delivery, SENG-1045), which cannot span replicas.
          # That WS server no longer exists (removed as part of PR #569's
          # demo-staging retirement). Nothing left in dev is known to require a
          # single-replica cap, but no one has confirmed it's SAFE to raise it
          # either (e.g. any other in-memory/sticky-session assumption). Left
          # at 1 deliberately rather than bumped unilaterally — flagging for a
          # human call, not fixing the value here.
          MAX_REPLICAS=$(if [ "$PREFIX" == "PROD" ]; then echo "20"; else echo "1"; fi)
          WORKLOAD_PROFILE=$(if [ "$PREFIX" == "PROD" ]; then echo "agora-prod"; else echo "Consumption"; fi)
          # Storage account backing /api/projects/* (promoted from the former
          # demo-staging surface — SCS-110/PR #569; the account itself is no
          # longer demo-only, real project uploads live here in every env).
          # TODO(PR #569 review, blocking): PROD_AZURE_STORAGE_ACCOUNT is not yet
          # set — until it is, prod deploys ship an empty AZURE_STORAGE_ACCOUNT
          # and every /api/projects/container call in prod will fail. Needs a
          # real prod storage account name before this can go out.
          AZURE_STORAGE_ACCOUNT=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_AZURE_STORAGE_ACCOUNT }}"; else echo "agorademodev"; fi)

          az deployment group what-if \
            --resource-group "${{ steps.set-env.outputs.RESOURCE_GROUP }}" \
            --template-file deployments/ACS/agora-vnet-deployment.bicep \
            --parameters \
              containerAppName=agora-ergon-${{ inputs.environment }} \
              environment=${{ inputs.environment }} \
              containerAppsEnvironmentId="${{ steps.fetch-config.outputs.container_apps_environment_id }}" \
              containerImage="${{ env.AZURE_REGISTRY }}/${{ env.AZURE_IMAGE_NAME }}:${{ steps.image-tag.outputs.TAG }}" \
              acrServer="${{ env.AZURE_REGISTRY }}" \
              acrUsername="${{ vars.PROD_ACR_USERNAME }}" \
              acrPassword="${{ secrets.PROD_ACR_PASSWORD }}" \
              logosApiUrl="${{ steps.fetch-config.outputs.logos_api_url }}" \
              hasuraAdminSecret="$HASURA_SECRET" \
              auth0ClientSecret="$AUTH0_CLIENT_SECRET_VAL" \
              auth0Secret="$AUTH0_SESSION_SECRET" \
              nextServerActionsEncryptionKey="$NEXT_SERVER_ACTIONS_KEY" \
              sentryDsn="$SENTRY_DSN" \
              appUrl="$APP_URL" \
              graphqlUrl="$GRAPHQL_URL" \
              hasuraWsUrl="$HASURA_WS_URL" \
              auth0Domain="$AUTH0_DOMAIN" \
              auth0ClientId="$AUTH0_CLIENT_ID" \
              auth0RedirectUri="$AUTH0_REDIRECT_URI" \
              auth0Audience="$AUTH0_AUDIENCE" \
              auth0BaseUrl="$AUTH0_BASE_URL" \
              auth0IssuerBaseUrl="$AUTH0_ISSUER_BASE_URL" \
              gaMeasurementId="$GA_MEASUREMENT_ID" \
              amplitudeApiKey="$AMPLITUDE_API_KEY" \
              customDomain="$CUSTOM_DOMAIN" \
              cpu="$CPU" \
              memory="$MEMORY" \
              minReplicas=$MIN_REPLICAS \
              maxReplicas=$MAX_REPLICAS \
              workloadProfileName="$WORKLOAD_PROFILE" \
              cosmosEndpoint="${{ steps.fetch-config.outputs.cosmos_endpoint }}" \
              cosmosKey="${{ steps.fetch-config.outputs.cosmos_key }}" \
              azureStorageAccount="$AZURE_STORAGE_ACCOUNT" \
            2>&1 | tee -a $GITHUB_STEP_SUMMARY

          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Deploy
        if: ${{ inputs.dry_run == false }}
        id: deploy
        env:
          PREFIX: ${{ steps.set-env.outputs.PREFIX }}
        run: |
          DEPLOYMENT_NAME="agora-ergon-${{ github.run_number }}-$(date +%s)"

          # Get environment-specific values
          HASURA_SECRET=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ secrets.PROD_HASURA_ADMIN_SECRET }}"; else echo "${{ secrets.DEV_HASURA_ADMIN_SECRET }}"; fi)
          AUTH0_CLIENT_SECRET_VAL=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ secrets.PROD_AUTH0_CLIENT_SECRET }}"; else echo "${{ secrets.DEV_AUTH0_CLIENT_SECRET }}"; fi)
          AUTH0_SESSION_SECRET=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ secrets.PROD_AUTH0_SECRET }}"; else echo "${{ secrets.DEV_AUTH0_SECRET }}"; fi)
          NEXT_SERVER_ACTIONS_KEY=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ secrets.PROD_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}"; else echo "${{ secrets.DEV_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}"; fi)
          SENTRY_DSN=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ secrets.PROD_SENTRY_DSN }}"; else echo "${{ secrets.DEV_SENTRY_DSN }}"; fi)
          APP_URL=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_URL }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_URL }}"; fi)
          GRAPHQL_URL=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_GRAPHQL_URL }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_GRAPHQL_URL }}"; fi)
          HASURA_WS_URL=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_HASURA_WS_URL }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_HASURA_WS_URL }}"; fi)
          AUTH0_DOMAIN=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_AUTH0_DOMAIN }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_AUTH0_DOMAIN }}"; fi)
          AUTH0_CLIENT_ID=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_AUTH0_CLIENT_ID }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_AUTH0_CLIENT_ID }}"; fi)
          AUTH0_REDIRECT_URI=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_AUTH0_REDIRECT_URI }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_AUTH0_REDIRECT_URI }}"; fi)
          AUTH0_AUDIENCE=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_AUTH0_AUDIENCE }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_AUTH0_AUDIENCE }}"; fi)
          AUTH0_BASE_URL=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_AUTH0_BASE_URL }}"; else echo "${{ vars.DEV_AUTH0_BASE_URL }}"; fi)
          AUTH0_ISSUER_BASE_URL=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_AUTH0_ISSUER_BASE_URL }}"; else echo "${{ vars.DEV_AUTH0_ISSUER_BASE_URL }}"; fi)
          GA_MEASUREMENT_ID=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_GA_MEASUREMENT_ID }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_GA_MEASUREMENT_ID }}"; fi)
          AMPLITUDE_API_KEY=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_NEXT_PUBLIC_AMPLITUDE_API_KEY }}"; else echo "${{ vars.DEV_NEXT_PUBLIC_AMPLITUDE_API_KEY }}"; fi)
          CUSTOM_DOMAIN=$(if [ "$PREFIX" == "PROD" ]; then echo "app.socratics.ai"; else echo "app.dev.socratics.ai"; fi)
          CPU=$(if [ "$PREFIX" == "PROD" ]; then echo "4.0"; else echo "1.0"; fi)
          MEMORY=$(if [ "$PREFIX" == "PROD" ]; then echo "8Gi"; else echo "2Gi"; fi)
          MIN_REPLICAS=$(if [ "$PREFIX" == "PROD" ]; then echo "5"; else echo "1"; fi)
          # dev capped at 1: STALE RATIONALE (PR #569 re-review) — this cap was
          # sized around demo-staging's stateful, in-memory WebSocket server
          # (openclaw job delivery, SENG-1045), which cannot span replicas.
          # That WS server no longer exists (removed as part of PR #569's
          # demo-staging retirement). Nothing left in dev is known to require a
          # single-replica cap, but no one has confirmed it's SAFE to raise it
          # either (e.g. any other in-memory/sticky-session assumption). Left
          # at 1 deliberately rather than bumped unilaterally — flagging for a
          # human call, not fixing the value here.
          MAX_REPLICAS=$(if [ "$PREFIX" == "PROD" ]; then echo "20"; else echo "1"; fi)
          # Storage account backing /api/projects/* (promoted from the former
          # demo-staging surface — SCS-110/PR #569; the account itself is no
          # longer demo-only, real project uploads live here in every env).
          # TODO(PR #569 review, blocking): PROD_AZURE_STORAGE_ACCOUNT is not yet
          # set — until it is, prod deploys ship an empty AZURE_STORAGE_ACCOUNT
          # and every /api/projects/container call in prod will fail. Needs a
          # real prod storage account name before this can go out.
          AZURE_STORAGE_ACCOUNT=$(if [ "$PREFIX" == "PROD" ]; then echo "${{ vars.PROD_AZURE_STORAGE_ACCOUNT }}"; else echo "agorademodev"; fi)

          DEPLOYMENT_OUTPUT=$(az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "${{ steps.set-env.outputs.RESOURCE_GROUP }}" \
            --template-file deployments/ACS/agora-vnet-deployment.bicep \
            --parameters \
              containerAppName=agora-ergon-${{ inputs.environment }} \
              environment=${{ inputs.environment }} \
              containerAppsEnvironmentId="${{ steps.fetch-config.outputs.container_apps_environment_id }}" \
              containerImage="${{ env.AZURE_REGISTRY }}/${{ env.AZURE_IMAGE_NAME }}:${{ steps.image-tag.outputs.TAG }}" \
              acrServer="${{ env.AZURE_REGISTRY }}" \
              acrUsername="${{ vars.PROD_ACR_USERNAME }}" \
              acrPassword="${{ secrets.PROD_ACR_PASSWORD }}" \
              logosApiUrl="${{ steps.fetch-config.outputs.logos_api_url }}" \
              hasuraAdminSecret="$HASURA_SECRET" \
              auth0ClientSecret="$AUTH0_CLIENT_SECRET_VAL" \
              auth0Secret="$AUTH0_SESSION_SECRET" \
              nextServerActionsEncryptionKey="$NEXT_SERVER_ACTIONS_KEY" \
              sentryDsn="$SENTRY_DSN" \
              appUrl="$APP_URL" \
              graphqlUrl="$GRAPHQL_URL" \
              hasuraWsUrl="$HASURA_WS_URL" \
              auth0Domain="$AUTH0_DOMAIN" \
              auth0ClientId="$AUTH0_CLIENT_ID" \
              auth0RedirectUri="$AUTH0_REDIRECT_URI" \
              auth0Audience="$AUTH0_AUDIENCE" \
              auth0BaseUrl="$AUTH0_BASE_URL" \
              auth0IssuerBaseUrl="$AUTH0_ISSUER_BASE_URL" \
              gaMeasurementId="$GA_MEASUREMENT_ID" \
              amplitudeApiKey="$AMPLITUDE_API_KEY" \
              customDomain="$CUSTOM_DOMAIN" \
              cpu="$CPU" \
              memory="$MEMORY" \
              minReplicas=$MIN_REPLICAS \
              maxReplicas=$MAX_REPLICAS \
              workloadProfileName="$WORKLOAD_PROFILE" \
              cosmosEndpoint="${{ steps.fetch-config.outputs.cosmos_endpoint }}" \
              cosmosKey="${{ steps.fetch-config.outputs.cosmos_key }}" \
              azureStorageAccount="$AZURE_STORAGE_ACCOUNT" \
            --query 'properties.outputs' \
            --output json)

          CONTAINER_APP_ID=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.containerAppId.value')
          CONTAINER_APP_NAME=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.containerAppName.value')
          CONTAINER_APP_URL=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.containerAppUrl.value')
          CONTAINER_APP_FQDN=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.containerAppFQDN.value')
          MANAGED_IDENTITY_PRINCIPAL_ID=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.managedIdentityPrincipalId.value')
          LOGOS_API_URL=$(echo "$DEPLOYMENT_OUTPUT" | jq -r '.logosApiUrl.value')

          echo "container_app_id=$CONTAINER_APP_ID" >> $GITHUB_OUTPUT
          echo "container_app_name=$CONTAINER_APP_NAME" >> $GITHUB_OUTPUT
          echo "container_app_url=$CONTAINER_APP_URL" >> $GITHUB_OUTPUT
          echo "container_app_fqdn=$CONTAINER_APP_FQDN" >> $GITHUB_OUTPUT
          echo "managed_identity_principal_id=$MANAGED_IDENTITY_PRINCIPAL_ID" >> $GITHUB_OUTPUT
          echo "logos_api_url=$LOGOS_API_URL" >> $GITHUB_OUTPUT

      - name: Publish outputs to App Configuration
        if: ${{ inputs.dry_run == false }}
        run: |
          APP_CONFIG_NAME="logos-${{ inputs.environment }}-config"
          KEY_PREFIX="agora-ergon/${{ inputs.environment }}"

          # Core container app info
          az appconfig kv set --name "$APP_CONFIG_NAME" --key "${KEY_PREFIX}/containerAppId" --value "${{ steps.deploy.outputs.container_app_id }}" --label "${{ inputs.environment }}" --yes --output none
          az appconfig kv set --name "$APP_CONFIG_NAME" --key "${KEY_PREFIX}/containerAppName" --value "${{ steps.deploy.outputs.container_app_name }}" --label "${{ inputs.environment }}" --yes --output none
          az appconfig kv set --name "$APP_CONFIG_NAME" --key "${KEY_PREFIX}/containerAppUrl" --value "${{ steps.deploy.outputs.container_app_url }}" --label "${{ inputs.environment }}" --yes --output none
          az appconfig kv set --name "$APP_CONFIG_NAME" --key "${KEY_PREFIX}/containerAppFQDN" --value "${{ steps.deploy.outputs.container_app_fqdn }}" --label "${{ inputs.environment }}" --yes --output none

          # Managed identity for RBAC assignments
          az appconfig kv set --name "$APP_CONFIG_NAME" --key "${KEY_PREFIX}/managedIdentityPrincipalId" --value "${{ steps.deploy.outputs.managed_identity_principal_id }}" --label "${{ inputs.environment }}" --yes --output none

          # Backend connection info
          az appconfig kv set --name "$APP_CONFIG_NAME" --key "${KEY_PREFIX}/logosApiUrl" --value "${{ steps.deploy.outputs.logos_api_url }}" --label "${{ inputs.environment }}" --yes --output none

          # Deployment metadata
          az appconfig kv set --name "$APP_CONFIG_NAME" --key "${KEY_PREFIX}/deployedAt" --value "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --label "${{ inputs.environment }}" --yes --output none
          az appconfig kv set --name "$APP_CONFIG_NAME" --key "${KEY_PREFIX}/imageTag" --value "${{ steps.image-tag.outputs.TAG }}" --label "${{ inputs.environment }}" --yes --output none
          az appconfig kv set --name "$APP_CONFIG_NAME" --key "${KEY_PREFIX}/resourceGroup" --value "${{ steps.set-env.outputs.RESOURCE_GROUP }}" --label "${{ inputs.environment }}" --yes --output none

      - name: Deployment Summary
        if: ${{ inputs.dry_run == false }}
        run: |
          echo "## Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Container App" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Name | ${{ steps.deploy.outputs.container_app_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ steps.deploy.outputs.container_app_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| FQDN | ${{ steps.deploy.outputs.container_app_fqdn }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ${{ steps.image-tag.outputs.TAG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Logos API | ${{ steps.deploy.outputs.logos_api_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Managed Identity | ${{ steps.deploy.outputs.managed_identity_principal_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### App Configuration Keys Updated" >> $GITHUB_STEP_SUMMARY
          echo "Published to \`logos-${{ inputs.environment }}-config\`:" >> $GITHUB_STEP_SUMMARY
          echo "- \`agora-ergon/${{ inputs.environment }}/containerAppId\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`agora-ergon/${{ inputs.environment }}/containerAppName\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`agora-ergon/${{ inputs.environment }}/containerAppUrl\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`agora-ergon/${{ inputs.environment }}/containerAppFQDN\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`agora-ergon/${{ inputs.environment }}/managedIdentityPrincipalId\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`agora-ergon/${{ inputs.environment }}/logosApiUrl\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`agora-ergon/${{ inputs.environment }}/deployedAt\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`agora-ergon/${{ inputs.environment }}/imageTag\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`agora-ergon/${{ inputs.environment }}/resourceGroup\`" >> $GITHUB_STEP_SUMMARY

      - name: Send success notification
        if: success() && inputs.dry_run == false
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{"text": "🚀 Agora (Ergon Stack) deployed!\nURL: ${{ steps.deploy.outputs.container_app_url }}\nLogos: ${{ steps.deploy.outputs.logos_api_url }}"}' \
          ${{ secrets.HERMES_WEBHOOK_URL }} || true

      - name: Send failure notification
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d '{"text": "❌ Agora (Ergon Stack) deployment failed!\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
          ${{ secrets.HERMES_WEBHOOK_URL }} || true
